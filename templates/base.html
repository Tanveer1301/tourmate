<!DOCTYPE html>
<html lang="bn" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f8fafc">
    <title>{% block title %}TourMate - ট্যুর হোক সহজ, হিসাব থাকুক নির্ভুল{% endblock %}</title>

    <!-- Google Fonts: Plus Jakarta Sans & Hind Siliguri for Bengali -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN with Custom Palette & Typography -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Hind Siliguri"', '"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
                        display: ['"Plus Jakarta Sans"', '"Hind Siliguri"', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8'
                        }
                    },
                    borderRadius: {
                        '3xl': '1.5rem',
                        '4xl': '2rem'
                    }
                }
            }
        };
    </script>

    <script>
        // Apply saved theme immediately before render
        (function() {
            try {
                const theme = localStorage.getItem('tourmate_theme') || 'light';
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) {}
        })();
    </script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>

    <!-- Google Identity Services (GIS) SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Centralized Mobile API Client -->
    <script src="/static/js/api.js"></script>

    <style>
        [x-cloak] {
            display: none !important;
        }
        /* Smooth touch scrolling & hide scrollbar for clean app feel */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Mobile safe-area padding support */
        .pb-safe {
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
        }
        .pt-safe {
            padding-top: max(0.75rem, env(safe-area-inset-top));
        }

        /* High-contrast, crystal-clear inputs for Light & Dark mode */
        input, textarea, select {
            color: #0f172a;
        }
        input::placeholder, textarea::placeholder {
            color: #94a3b8;
        }
        .dark input:not([type="checkbox"]):not([type="radio"]),
        .dark textarea,
        .dark select {
            color: #f8fafc !important;
            background-color: #1e293b !important;
            border-color: #334155 !important;
        }
        .dark input::placeholder,
        .dark textarea::placeholder {
            color: #94a3b8 !important;
        }
        .dark input:disabled,
        .dark textarea:disabled,
        .dark select:disabled {
            background-color: #0f172a !important;
            color: #64748b !important;
            border-color: #1e293b !important;
        }
        .dark input:focus,
        .dark textarea:focus,
        .dark select:focus {
            border-color: #3b82f6 !important;
        }
    </style>
</head>
<body class="w-full bg-slate-100 dark:bg-slate-900 font-sans text-slate-800 dark:text-slate-100 antialiased min-h-full flex justify-center selection:bg-blue-100 transition-colors duration-200">

    <!-- Mobile Shell Container: Max-w-md with App-like Canvas -->
    <div class="w-full max-w-md mx-auto min-h-screen bg-slate-50 dark:bg-slate-900 flex flex-col relative shadow-2xl border-x border-slate-200/80 dark:border-slate-800 overflow-x-hidden transition-colors duration-200">

        <!-- Global Toast Notification Component -->
        <div x-data="{
                show: false,
                message: '',
                type: 'success',
                trigger(msg, t = 'success') {
                    this.message = msg;
                    this.type = t;
                    this.show = true;
                    setTimeout(() => { this.show = false; }, 3200);
                }
             }"
             x-init="window.addEventListener('tourmate-toast', e => trigger(e.detail.message, e.detail.type))"
             class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-sm pointer-events-none"
             x-cloak>
            <div x-show="show"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0 -translate-y-4 scale-95"
                 x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100 scale-100"
                 x-transition:leave-end="opacity-0 -translate-y-2 scale-95"
                 :class="{
                    'bg-emerald-600 text-white shadow-emerald-200': type === 'success',
                    'bg-rose-600 text-white shadow-rose-200': type === 'error',
                    'bg-slate-900 text-white shadow-slate-300': type === 'info'
                 }"
                 class="px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 text-sm font-medium border border-white/10 pointer-events-auto">
                <template x-if="type === 'success'">
                    <svg class="w-5 h-5 flex-shrink-0 text-emerald-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
                    </svg>
                </template>
                <template x-if="type === 'error'">
                    <svg class="w-5 h-5 flex-shrink-0 text-rose-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </template>
                <span class="flex-1" x-text="message"></span>
            </div>
        </div>

        <!-- Top-Right Discreet Offline / Sync Status Indicator (Below Navbar) -->
        <div x-data="{
                isOnline: typeof navigator !== 'undefined' ? navigator.onLine : true,
                pendingCount: (function() {
                    try {
                        return (JSON.parse(localStorage.getItem('tourmate_offline_queue') || '[]')).length;
                    } catch(e) {
                        return 0;
                    }
                })(),
                isSyncing: false,
                update(detail) {
                    this.isOnline = detail.isOnline;
                    this.pendingCount = detail.pendingCount;
                    this.isSyncing = detail.isSyncing;
                }
             }"
             x-init="window.addEventListener('tourmate-sync-status', e => update(e.detail))"
             class="fixed top-14 right-3.5 z-40 pointer-events-auto"
             x-cloak>
            
            <!-- When Offline: Sleek Minimal Amber Pill -->
            <div x-show="!isOnline"
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0 translate-y-[-4px]"
                 x-transition:enter-end="opacity-100 translate-y-0"
                 class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-amber-500/95 text-white shadow-lg shadow-amber-500/20 backdrop-blur-md text-[10px] font-bold tracking-tight">
                <span class="w-1.5 h-1.5 rounded-full bg-white animate-ping"></span>
                <span x-text="pendingCount > 0 ? `অফলাইন (${pendingCount})` : 'অফলাইন'"></span>
            </div>

            <!-- When Syncing: Rotating Blue Pill -->
            <div x-show="isOnline && isSyncing"
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0 scale-95"
                 x-transition:enter-end="opacity-100 scale-100"
                 class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-blue-600/95 text-white shadow-lg shadow-blue-500/20 backdrop-blur-md text-[10px] font-bold tracking-tight">
                <svg class="w-3 h-3 animate-spin text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
                <span>সিঙ্ক হচ্ছে...</span>
            </div>

            <!-- When Online with Pending Items: Clickable Sync Pill -->
            <div x-show="isOnline && !isSyncing && pendingCount > 0"
                 @click="window.TourMateSync && window.TourMateSync.syncNow()"
                 x-transition:enter="transition ease-out duration-200"
                 class="cursor-pointer flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-600 text-white shadow-md text-[10px] font-bold tracking-tight hover:bg-emerald-700 active:scale-95 transition-all">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-200"></span>
                <span x-text="`সিঙ্ক করুন (${pendingCount})`"></span>
            </div>
        </div>

        <!-- Main Screen Content Slot -->
        <main class="flex-1 flex flex-col">
            {% block content %}{% endblock %}
        </main>

        <!-- Minimal Clean Footer -->
        <footer class="mt-auto py-4 px-4 text-center border-t border-slate-200/50">
            <div class="flex items-center justify-center gap-1.5 text-[11px] font-bold text-slate-400">
                <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
                <span class="font-extrabold tracking-wider text-slate-500">TourMate</span>
            </div>
        </footer>

    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
