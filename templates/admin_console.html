<!DOCTYPE html>
<html lang="bn" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TourMate - ⚡ Admin Console</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Hind Siliguri"', '"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
                        display: ['"Plus Jakarta Sans"', '"Hind Siliguri"', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8'
                        }
                    }
                }
            }
        };
    </script>

    <script>
        (function() {
            try {
                const theme = localStorage.getItem('tourmate_theme') || 'light';
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) {}
        })();
    </script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <script src="/static/js/api.js"></script>

    <style>
        [x-cloak] { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input, textarea, select { color: #0f172a; }
        .dark input:not([type="checkbox"]):not([type="radio"]),
        .dark textarea,
        .dark select {
            color: #f8fafc !important;
            background-color: #1e293b !important;
            border-color: #334155 !important;
        }
        .dark input:focus, .dark textarea:focus, .dark select:focus {
            border-color: #3b82f6 !important;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 font-sans text-slate-800 dark:text-slate-100 min-h-screen antialiased transition-colors duration-200">

    <!-- Global Toast Component -->
    <div x-data="{
            show: false,
            message: '',
            type: 'success',
            trigger(msg, t = 'success') {
                this.message = msg;
                this.type = t;
                this.show = true;
                setTimeout(() => { this.show = false; }, 3200);
            }
         }"
         x-init="window.addEventListener('tourmate-toast', e => trigger(e.detail.message, e.detail.type))"
         class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-sm pointer-events-none"
         x-cloak>
        <div x-show="show"
             x-transition
             :class="{
                'bg-emerald-600 text-white shadow-emerald-200': type === 'success',
                'bg-rose-600 text-white shadow-rose-200': type === 'error',
                'bg-slate-900 text-white shadow-slate-300': type === 'info'
             }"
             class="px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 text-sm font-medium border border-white/10 pointer-events-auto">
            <span class="flex-1" x-text="message"></span>
        </div>
    </div>

    <!-- Main Admin Shell -->
    <div x-data="adminConsolePage()" x-init="init()" class="min-h-screen flex flex-col">

        <!-- Top Header Bar -->
        <header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 lg:px-8 py-3.5 transition-colors">
            <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
                
                <!-- Left: Brand Logo & Title -->
                <div class="flex items-center gap-3">
                    <a href="/tours" class="flex items-center gap-2 group">
                        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white font-bold text-sm shadow-md shadow-blue-500/20 group-hover:scale-105 transition-transform">
                            TM
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="font-extrabold text-base tracking-tight text-slate-900 dark:text-white" x-text="configForm.app_name || 'TourMate'"></span>
                                <span class="px-2 py-0.5 rounded-full text-[11px] font-extrabold bg-gradient-to-r from-amber-500 to-orange-500 text-white shadow-sm flex items-center gap-1">
                                    <span>⚡</span>
                                    <span>Admin Console</span>
                                </span>
                            </div>
                            <p class="text-[11px] text-slate-400 font-medium" x-text="lang === 'bn' ? 'সিস্টেম ও প্ল্যাটফর্ম নিয়ন্ত্রণ কেন্দ্র' : 'System & Platform Command Center'"></p>
                        </div>
                    </a>
                </div>

                <!-- Right: Role Pill, Language, Theme, Back Button -->
                <div class="flex items-center gap-2 sm:gap-3">
                    
                    <!-- Admin Role Badge -->
                    <template x-if="adminUser">
                        <div class="hidden sm:flex items-center gap-1.5 px-3 py-1 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                            <span class="text-xs" x-text="getRoleIcon(adminUser.admin_role)"></span>
                            <span class="text-xs font-bold text-slate-700 dark:text-slate-300" x-text="getRoleName(adminUser.admin_role)"></span>
                        </div>
                    </template>

                    <!-- Language Toggle -->
                    <button @click="toggleLang()"
                            class="px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-bold transition-all border border-slate-200 dark:border-slate-700 flex items-center gap-1">
                        <span :class="lang === 'bn' ? 'text-blue-600 dark:text-blue-400 font-extrabold' : 'text-slate-400'">BN</span>
                        <span class="text-slate-400">/</span>
                        <span :class="lang === 'en' ? 'text-blue-600 dark:text-blue-400 font-extrabold' : 'text-slate-400'">EN</span>
                    </button>

                    <!-- Theme Toggle -->
                    <button @click="toggleTheme()"
                            class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 flex items-center justify-center transition-all">
                        <span x-text="theme === 'dark' ? '☀️' : '🌙'"></span>
                    </button>

                    <!-- Back to Tours Button -->
                    <a href="/tours"
                       class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-md shadow-blue-500/20 active:scale-95 transition-all">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                        <span x-text="lang === 'bn' ? 'ট্যুর ড্যাশবোর্ড' : 'Tours'"></span>
                    </a>
                </div>

            </div>
        </header>

        <!-- Unauthorized Screen if User has no Admin Role -->
        <template x-if="!loading && !isAuthorized">
            <div class="flex-1 max-w-md mx-auto flex flex-col items-center justify-center p-6 text-center">
                <div class="w-16 h-16 rounded-3xl bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 flex items-center justify-center text-3xl mb-4">
                    🚫
                </div>
                <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-2" x-text="lang === 'bn' ? 'অ্যাডমিন অ্যাক্সেস সীমাবদ্ধ' : 'Admin Access Restricted'"></h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mb-6 leading-relaxed" x-text="lang === 'bn' ? 'এই অ্যাডমিন কনসোলে প্রবেশের জন্য আপনার অ্যাকাউন্টে অ্যাডমিন রোল প্রয়োজন। অনুগ্রহ করে সুপার অ্যাডমিনের সাথে যোগাযোগ করুন অথবা সাধারণ ট্যুর ড্যাশবোর্ডে ফিরে যান।' : 'You need an administrator role to access this console. Please contact a Super Admin or return to your tours dashboard.'"></p>
                <a href="/tours" class="px-5 py-2.5 bg-blue-600 text-white font-bold rounded-2xl text-xs shadow-md">
                    <span x-text="lang === 'bn' ? 'আমার ট্যুরে ফিরে যান' : 'Back to My Tours'"></span>
                </a>
            </div>
        </template>

        <!-- Authorized Admin Console Workspace -->
        <template x-if="isAuthorized">
            <div class="flex-1 max-w-7xl w-full mx-auto px-4 lg:px-8 py-6 flex flex-col gap-6">

                <!-- Navigation Tabs Bar -->
                <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1 border-b border-slate-200 dark:border-slate-800">
                    
                    <!-- Tab 1: Overview & Metrics -->
                    <button type="button"
                            id="tab-btn-overview"
                            @click="setTab('overview')"
                            :class="activeTab === 'overview' ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20' : 'bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 border border-slate-200/80 dark:border-slate-800'"
                            class="px-4 py-2.5 rounded-2xl text-xs font-bold flex items-center gap-2 flex-shrink-0 cursor-pointer transition-all">
                        <span>📊</span>
                        <span x-text="lang === 'bn' ? 'ওভারভিউ ও মেট্রিক্স' : 'Overview & Metrics'"></span>
                    </button>

                    <!-- Tab 2: User & Role Manager -->
                    <button type="button"
                            id="tab-btn-users"
                            @click="setTab('users')"
                            :class="activeTab === 'users' ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20' : 'bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 border border-slate-200/80 dark:border-slate-800'"
                            class="px-4 py-2.5 rounded-2xl text-xs font-bold flex items-center gap-2 flex-shrink-0 cursor-pointer transition-all">
                        <span>👥</span>
                        <span x-text="lang === 'bn' ? 'ইউজার ও রোল ম্যানেজার' : 'Users & Roles'"></span>
                        <template x-if="usersList.length > 0">
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold"
                                  :class="activeTab === 'users' ? 'bg-white/20 text-white' : 'bg-blue-100 text-blue-800 dark:bg-blue-950 dark:text-blue-300'"
                                  x-text="usersList.length"></span>
                        </template>
                    </button>

                    <!-- Tab 3: Tours Explorer -->
                    <button type="button"
                            id="tab-btn-tours"
                            @click="setTab('tours')"
                            :class="activeTab === 'tours' ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20' : 'bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 border border-slate-200/80 dark:border-slate-800'"
                            class="px-4 py-2.5 rounded-2xl text-xs font-bold flex items-center gap-2 flex-shrink-0 cursor-pointer transition-all">
                        <span>🗺️</span>
                        <span x-text="lang === 'bn' ? 'ট্যুর এক্সপ্লোরার (God-Mode)' : 'Tours Explorer'"></span>
                        <template x-if="toursList.length > 0">
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold"
                                  :class="activeTab === 'tours' ? 'bg-white/20 text-white' : 'bg-blue-100 text-blue-800 dark:bg-blue-950 dark:text-blue-300'"
                                  x-text="toursList.length"></span>
                        </template>
                    </button>

                    <!-- Tab 4: Appearance & CMS -->
                    <button type="button"
                            id="tab-btn-cms"
                            @click="setTab('cms')"
                            :class="activeTab === 'cms' ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20' : 'bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 border border-slate-200/80 dark:border-slate-800'"
                            class="px-4 py-2.5 rounded-2xl text-xs font-bold flex items-center gap-2 flex-shrink-0 cursor-pointer transition-all">
                        <span>🎨</span>
                        <span x-text="lang === 'bn' ? 'সাইট কাস্টমাইজার (CMS)' : 'Appearance & CMS'"></span>
                    </button>

                    <!-- Tab 5: Complaints & Suggestions Desk -->
                    <button type="button"
                            id="tab-btn-feedback"
                            @click="setTab('feedback')"
                            :class="activeTab === 'feedback' ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20' : 'bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 border border-slate-200/80 dark:border-slate-800'"
                            class="px-4 py-2.5 rounded-2xl text-xs font-bold flex items-center gap-2 flex-shrink-0 cursor-pointer transition-all">
                        <span>💬</span>
                        <span x-text="lang === 'bn' ? 'অভিযোগ ও পরামর্শ ডেস্ক' : 'Complaints & Desk'"></span>
                        <template x-if="metrics && metrics.feedbacks_pending > 0">
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-500 text-white animate-pulse"
                                  x-text="metrics.feedbacks_pending"></span>
                        </template>
                    </button>

                </div>


                <!-- TAB 1: OVERVIEW & METRICS -->
                <div x-show="activeTab === 'overview'" class="space-y-6">
                    
                    <!-- Metrics Cards Grid -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        
                        <!-- Card 1: Users Overview -->
                        <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 border border-slate-200/80 dark:border-slate-800 shadow-sm relative overflow-hidden">
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-xs font-bold text-slate-500 dark:text-slate-400" x-text="lang === 'bn' ? 'মোট রেজিস্টার্ড ইউজার' : 'Registered Users'"></span>
                                <div class="w-8 h-8 rounded-xl bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 flex items-center justify-center text-sm font-bold">
                                    👥
                                </div>
                            </div>
                            <div class="text-2xl font-extrabold text-slate-900 dark:text-white" x-text="metrics.users_total || 0"></div>
                            <div class="mt-3 pt-3 border-t border-slate-100 dark:border-slate-800/80 grid grid-cols-2 gap-2 text-[11px] text-slate-500 dark:text-slate-400">
                                <div>
                                    <span class="block text-slate-400 font-medium" x-text="lang === 'bn' ? 'আজ নতুন:' : 'Today:'"></span>
                                    <span class="font-bold text-emerald-600 dark:text-emerald-400" x-text="`+${metrics.users_today || 0}`"></span>
                                </div>
                                <div>
                                    <span class="block text-slate-400 font-medium" x-text="lang === 'bn' ? 'চলতি মাস:' : 'This Month:'"></span>
                                    <span class="font-bold text-blue-600 dark:text-blue-400" x-text="`+${metrics.users_month || 0}`"></span>
                                </div>
                                <div>
                                    <span class="block text-slate-400 font-medium" x-text="lang === 'bn' ? 'চলতি বছর:' : 'This Year:'"></span>
                                    <span class="font-bold text-slate-700 dark:text-slate-300" x-text="`+${metrics.users_year || 0}`"></span>
                                </div>
                                <div>
                                    <span class="block text-slate-400 font-medium" x-text="lang === 'bn' ? 'নিষ্ক্রিয় / ব্লক:' : 'Inactive:'"></span>
                                    <span class="font-bold text-rose-500" x-text="metrics.users_inactive || 0"></span>
                                </div>
                            </div>
                        </div>

                        <!-- Card 2: Tours Activity -->
                        <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 border border-slate-200/80 dark:border-slate-800 shadow-sm relative overflow-hidden">
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-xs font-bold text-slate-500 dark:text-slate-400" x-text="lang === 'bn' ? 'ট্যুরসমূহ' : 'Tours'"></span>
                                <div class="w-8 h-8 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-sm font-bold">
                                    🗺️
                                </div>
                            </div>
                            <div class="text-2xl font-extrabold text-slate-900 dark:text-white" x-text="metrics.tours_total || 0"></div>
                            <div class="mt-3 pt-3 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between text-[11px]">
                                <div>
                                    <span class="block text-slate-400 font-medium" x-text="lang === 'bn' ? 'চলমান ট্যুর:' : 'Active:'"></span>
                                    <span class="font-bold text-emerald-600 dark:text-emerald-400" x-text="metrics.tours_active || 0"></span>
                                </div>
                                <div>
                                    <span class="block text-slate-400 font-medium" x-text="lang === 'bn' ? 'আর্কাইভড:' : 'Archived:'"></span>
                                    <span class="font-bold text-amber-600 dark:text-amber-400" x-text="metrics.tours_archived || 0"></span>
                                </div>
                            </div>
                        </div>

                        <!-- Card 3: Financial Volume -->
                        <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 border border-slate-200/80 dark:border-slate-800 shadow-sm relative overflow-hidden">
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-xs font-bold text-slate-500 dark:text-slate-400" x-text="lang === 'bn' ? 'প্ল্যাটফর্ম ভলিউম' : 'Platform Volume'"></span>
                                <div class="w-8 h-8 rounded-xl bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-sm font-bold">
                                    💰
                                </div>
                            </div>
                            <div class="text-lg font-extrabold text-slate-900 dark:text-white truncate">
                                ৳ <span x-text="formatNumber(metrics.total_expenses_volume)"></span>
                            </div>
                            <div class="mt-3 pt-3 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between text-[11px]">
                                <div>
                                    <span class="block text-slate-400 font-medium" x-text="lang === 'bn' ? 'মোট জমা (কমন ফান্ড):' : 'Total Deposits:'"></span>
                                    <span class="font-bold text-emerald-600" x-text="`৳ ${formatNumber(metrics.total_deposits_volume)}`"></span>
                                </div>
                            </div>
                        </div>

                        <!-- Card 4: Feedback & Support -->
                        <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 border border-slate-200/80 dark:border-slate-800 shadow-sm relative overflow-hidden">
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-xs font-bold text-slate-500 dark:text-slate-400" x-text="lang === 'bn' ? 'অভিযোগ ও পরামর্শ' : 'Feedback Desk'"></span>
                                <div class="w-8 h-8 rounded-xl bg-amber-50 dark:bg-amber-950/60 text-amber-600 dark:text-amber-400 flex items-center justify-center text-sm font-bold">
                                    🎧
                                </div>
                            </div>
                            <div class="text-2xl font-extrabold text-amber-600 dark:text-amber-400" x-text="metrics.feedbacks_pending || 0">
                            </div>
                            <div class="mt-3 pt-3 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between text-[11px]">
                                <div>
                                    <span class="block text-slate-400 font-medium" x-text="lang === 'bn' ? 'অপেক্ষমান উত্তর:' : 'Pending Reply:'"></span>
                                    <span class="font-bold text-amber-500" x-text="metrics.feedbacks_pending || 0"></span>
                                </div>
                                <div>
                                    <span class="block text-slate-400 font-medium" x-text="lang === 'bn' ? 'সমাধানকৃত:' : 'Resolved:'"></span>
                                    <span class="font-bold text-emerald-600 dark:text-emerald-400" x-text="metrics.feedbacks_resolved || 0"></span>
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- Quick Action Shortcuts -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2">
                        <div @click="setTab('users')" class="cursor-pointer p-4 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-blue-500 shadow-sm transition-all group">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-2xl bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-400 flex items-center justify-center text-lg">
                                    👑
                                </div>
                                <div>
                                    <h4 class="text-xs font-bold text-slate-900 dark:text-white group-hover:text-blue-600 transition-colors" x-text="lang === 'bn' ? 'রোল ও পারমিশন ম্যানেজ করুন' : 'Manage Roles & Permissions'"></h4>
                                    <p class="text-[11px] text-slate-400" x-text="lang === 'bn' ? 'বিশ্বস্ত ইউজারদের Super Admin বা Sub-Admin রোল দিন' : 'Assign roles to trusted users'"></p>
                                </div>
                            </div>
                        </div>

                        <div @click="setTab('cms')" class="cursor-pointer p-4 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-indigo-500 shadow-sm transition-all group">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-2xl bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-lg">
                                    📢
                                </div>
                                <div>

                                                  x-text="item.status === 'RESOLVED' ? (lang === 'bn' ? '✅ সমাধান করা হয়েছে' : 'Resolved') : (lang === 'bn' ? '⏳ অপেক্ষমান' : 'Pending')"></span>

                                            <!-- Edit Feedback Button (Super Admin / Support) -->

                        <textarea x-model="feedbackEditForm.admin_reply" rows="3" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-medium outline-none focus:ring-2 focus:ring-blue-500" :placeholder="lang === 'bn' ? 'অফিসিয়াল উত্তর লিখুন...' : 'Write official reply...'"></textarea>

                        <span x-text="savingFeedbackEdit ? (lang === 'bn' ? 'সংরক্ষণ হচ্ছে...' : 'Saving...') : (lang === 'bn' ? 'আপডেট সংরক্ষণ করুন' : 'Save Changes')"></span>

    <!-- Admin Console Alpine Logic Script -->
    <script>
        function adminConsolePage() {
            return {
                lang: localStorage.getItem('tourmate_lang') || 'bn',
                theme: localStorage.getItem('tourmate_theme') || 'light',
                activeTab: 'overview',
                isAuthorized: false,
                loading: true,
                adminUser: null,

                metrics: {},
                usersList: [],
                loadingUsers: false,
                userSearch: '',
                userRoleFilter: 'ALL',
                userStatusFilter: 'ALL',
                userActivityFilter: 'ALL',

                toursList: [],
                loadingTours: false,
                tourSearch: '',
                tourSortBy: 'latest',
                tourStatusFilter: 'all',

                showTourEditModal: false,
                tourEditForm: {
                    id: null,
                    title: '',
                    description: '',
                    budget_limit: '',
                    color_theme: '#2563EB',
                    is_archived: false
                },

                configForm: {
                    app_name: 'TourMate',
                    slogan_bn: '',
                    slogan_en: '',
                    welcome_title_bn: '',
                    welcome_title_en: '',
                    welcome_msg_bn: '',
                    welcome_msg_en: '',
                    footer_text_bn: '',
                    footer_text_en: '',
                    primary_color: '#2563EB',
                    bg_shade: '#F8FAFC',
                    custom_themes: [],
                    custom_designations: [],
                    announcement_enabled: false,
                    announcement_id: 'announcement-1',
                    announcement_title_bn: '',
                    announcement_title_en: '',
                    announcement_msg_bn: '',
                    announcement_msg_en: '',
                    announcement_start: '',
                    announcement_end: ''
                },
                newThemeColor: '#3B82F6',
                newDesignationText: '',
                savingConfig: false,

                feedbacksList: [],
                loadingFeedbacks: false,
                feedbackTypeFilter: 'ALL',
                feedbackStatusFilter: 'ALL',
                activeReplyId: null,
                replyText: '',
                replyMarkResolved: true,
                replySubmitting: false,

                showFeedbackEditModal: false,
                feedbackEditForm: {
                    id: null,
                    message: '',
                    feedback_type: 'SUGGESTION',
                    status: 'PENDING',
                    admin_reply: '',
                },
                savingFeedbackEdit: false,

                async init() {
                    if (!TourMateAPI.ensureAuth()) return;
                    await this.checkAuthAndRole();
                    if (this.isAuthorized) {
                        this.loadMetrics();
                        this.loadUsers();
                        this.loadTours();
                        this.loadConfig();
                        this.loadFeedbacks();
                    }
                },

                async checkAuthAndRole() {
                    this.loading = true;
                    try {
                        const me = await TourMateAPI.getAdminMe();
                        this.adminUser = me;
                        this.isAuthorized = !!me.id;
                    } catch (err) {
                        console.warn('Admin check error:', err);
                        this.isAuthorized = false;
                    } finally {
                        this.loading = false;
                    }
                },

                setTab(tab) {
                    this.activeTab = tab;
                    if (tab === 'overview') this.loadMetrics();
                    else if (tab === 'users') this.loadUsers();
                    else if (tab === 'tours') this.loadTours();
                    else if (tab === 'cms') this.loadConfig();
                    else if (tab === 'feedback') this.loadFeedbacks();
                },

                toggleLang() {
                    this.lang = this.lang === 'bn' ? 'en' : 'bn';
                    localStorage.setItem('tourmate_lang', this.lang);
                },

                toggleTheme() {
                    this.theme = this.theme === 'dark' ? 'light' : 'dark';
                    localStorage.setItem('tourmate_theme', this.theme);
                    if (this.theme === 'dark') {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                },

                getRoleIcon(role) {
                    const icons = {
                        'SUPER_ADMIN': '👑',
                        'SUB_ADMIN': '🛡️',
                        'CONTENT_MANAGER': '🎨',
                        'SUPPORT': '🎧',
                        'NONE': '👤'
                    };
                    return icons[role] || '👤';
                },

                getRoleName(role) {
                    const namesBn = {
                        'SUPER_ADMIN': 'Super Admin',
                        'SUB_ADMIN': 'Sub-Admin / Moderator',
                        'CONTENT_MANAGER': 'UI & Content Manager',
                        'SUPPORT': 'Support Executive',
                        'NONE': 'Regular User'
                    };
                    return namesBn[role] || role;
                },

                formatDate(dateStr) {
                    if (!dateStr) return '';
                    try {
                        const d = new Date(dateStr);
                        return d.toLocaleDateString(this.lang === 'bn' ? 'bn-BD' : 'en-US', {
                            month: 'short',
                            day: 'numeric',
                            year: 'numeric'
                        });
                    } catch(e) {
                        return dateStr;
                    }
                },

                formatNumber(num) {
                    if (!num && num !== 0) return '0.00';
                    return Number(num).toLocaleString('en-US', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    });
                },

                async loadMetrics() {
                    try {
                        this.metrics = await TourMateAPI.getAdminMetrics();
                    } catch (err) {
                        console.error('Metrics load failed:', err);
                    }
                },

                async loadUsers() {
                    this.loadingUsers = true;
                    try {
                        const params = {};
                        if (this.userSearch.trim()) params.search = this.userSearch.trim();
                        if (this.userRoleFilter !== 'ALL') params.role = this.userRoleFilter;
                        if (this.userStatusFilter !== 'ALL') params.status = this.userStatusFilter;
                        if (this.userActivityFilter && this.userActivityFilter !== 'ALL') params.activity = this.userActivityFilter;
                        this.usersList = await TourMateAPI.getAdminUsers(params);
                    } catch (err) {
                        console.error('Failed to load users:', err);
                        window.showToast(err.message || 'Users load failed', 'error');
                    } finally {
                        this.loadingUsers = false;
                    }
                },

                formatLastActive(user) {
                    if (!user.last_login) {
                        return this.lang === 'bn' ? 'কখনো সক্রিয় হয়নি' : 'Never logged in';
                    }
                    try {
                        const now = new Date();
                        const login = new Date(user.last_login);
                        const diffMs = now - login;
                        const diffMins = Math.floor(diffMs / 60000);
                        const diffHours = Math.floor(diffMs / 3600000);
                        const diffDays = Math.floor(diffMs / 86400000);

                        if (diffMins < 60) {
                            return this.lang === 'bn' ? 'এইমাত্র সক্রিয়' : 'Active just now';
                        }
                        if (diffHours < 24) {
                            return this.lang === 'bn' ? `${diffHours} ঘণ্টা আগে` : `${diffHours}h ago`;
                        }
                        if (diffDays === 1) {
                            return this.lang === 'bn' ? 'গতকাল সক্রিয়' : 'Yesterday';
                        }
                        if (diffDays < 30) {
                            return this.lang === 'bn' ? `${diffDays} দিন আগে` : `${diffDays}d ago`;
                        }
                        const months = Math.floor(diffDays / 30);
                        return this.lang === 'bn' ? `${months} মাস ধরে নিষ্ক্রিয়` : `${months}mo inactive`;
                    } catch(e) {
                        return '';
                    }
                },

                getActivityBadgeClass(user) {
                    if (!user.last_login) return 'bg-slate-300 dark:bg-slate-600';
                    const days = (new Date() - new Date(user.last_login)) / 86400000;
                    if (days < 7) return 'bg-emerald-500 animate-pulse';
                    if (days < 30) return 'bg-amber-500';
                    return 'bg-rose-500';
                },

                getActivityTextClass(user) {
                    if (!user.last_login) return 'text-slate-400 dark:text-slate-500';
                    const days = (new Date() - new Date(user.last_login)) / 86400000;
                    if (days < 7) return 'text-emerald-700 dark:text-emerald-400 font-semibold';
                    if (days < 30) return 'text-amber-700 dark:text-amber-400';
                    return 'text-rose-600 dark:text-rose-400 font-semibold';
                },

                async changeUserRole(user, newRole) {
                    try {
                        const updated = await TourMateAPI.updateAdminUserRole(user.id, newRole);
                        user.admin_role = updated.admin_role;
                        window.showToast(this.lang === 'bn' ? `ইউজারের রোল সফলভাবে '${this.getRoleName(newRole)}' এ পরিবর্তন করা হয়েছে!` : 'Role updated successfully!', 'success');
                    } catch (err) {
                        window.showToast(err.message || 'Failed to update role', 'error');
                        this.loadUsers();
                    }
                },

                async toggleUserActive(user) {
                    const nextActive = !user.is_active;
                    const confirmMsg = this.lang === 'bn'
                        ? `আপনি কি নিশ্চিতভাবে এই ইউজারকে ${nextActive ? 'সক্রিয়' : 'ব্লক'} করতে চান?`
                        : `Are you sure you want to ${nextActive ? 'unblock' : 'block'} this user?`;
                    if (!confirm(confirmMsg)) return;

                    try {
                        await TourMateAPI.updateAdminUserStatus(user.id, nextActive);
                        user.is_active = nextActive;
                        window.showToast(this.lang === 'bn' ? 'ইউজার স্ট্যাটাস পরিবর্তন হয়েছে।' : 'User status updated.', 'success');
                    } catch (err) {
                        window.showToast(err.message || 'Failed to update status', 'error');
                    }
                },

                async loadTours() {
                    this.loadingTours = true;
                    try {
                        const params = {};
                        if (this.tourSearch.trim()) params.search = this.tourSearch.trim();
                        if (this.tourSortBy) params.sort_by = this.tourSortBy;
                        if (this.tourStatusFilter !== 'all') params.filter_status = this.tourStatusFilter;
                        this.toursList = await TourMateAPI.getAdminTours(params);
                    } catch (err) {
                        console.error('Failed to load tours:', err);
                        window.showToast(err.message || 'Tours load failed', 'error');
                    } finally {
                        this.loadingTours = false;
                    }
                },

                openTourEditModal(tour) {
                    this.tourEditForm = {
                        id: tour.id,
                        title: tour.title || '',
                        description: tour.description || '',
                        budget_limit: tour.budget_limit || '',
                        color_theme: tour.color_theme || '#2563EB',
                        is_archived: !!tour.is_archived
                    };
                    this.showTourEditModal = true;
                },

                async saveTourEdit() {
                    if (!this.tourEditForm.id) return;
                    try {
                        const payload = {
                            title: this.tourEditForm.title,
                            description: this.tourEditForm.description,
                            budget_limit: this.tourEditForm.budget_limit ? Number(this.tourEditForm.budget_limit) : null,
                            color_theme: this.tourEditForm.color_theme,
                            is_archived: this.tourEditForm.is_archived
                        };
                        const updated = await TourMateAPI.updateAdminTour(this.tourEditForm.id, payload);
                        this.showTourEditModal = false;
                        window.showToast(this.lang === 'bn' ? 'ট্যুর সফলভাবে আপডেট করা হয়েছে!' : 'Tour updated successfully!', 'success');
                        this.loadTours();
                    } catch (err) {
                        window.showToast(err.message || 'Failed to update tour', 'error');
                    }
                },

                async deleteTour(tour) {
                    const confirmMsg = this.lang === 'bn'
                        ? `সাবধান! আপনি কি নিশ্চিতভাবে '${tour.title}' ট্যুরটি স্থায়ীভাবে মুছে ফেলতে চান? এর সকল ডেপোজিট ও খরচ মুছে যাবে!`
                        : `Danger! Are you sure you want to permanently delete '${tour.title}'? All deposits & expenses will be deleted!`;
                    if (!confirm(confirmMsg)) return;

                    try {
                        await TourMateAPI.deleteAdminTour(tour.id);
                        window.showToast(this.lang === 'bn' ? 'ট্যুর সফলভাবে মুছে ফেলা হয়েছে।' : 'Tour deleted.', 'success');
                        this.loadTours();
                        this.loadMetrics();
                    } catch (err) {
                        window.showToast(err.message || 'Failed to delete tour', 'error');
                    }
                },

                async loadConfig() {
                    try {
                        const cfg = await TourMateAPI.getAdminConfig();
                        this.configForm = {
                            app_name: cfg.app_name || 'TourMate',
                            slogan_bn: cfg.slogan_bn || '',
                            slogan_en: cfg.slogan_en || '',
                            welcome_title_bn: cfg.welcome_title_bn || '',
                            welcome_title_en: cfg.welcome_title_en || '',
                            welcome_msg_bn: cfg.welcome_msg_bn || '',
                            welcome_msg_en: cfg.welcome_msg_en || '',
                            footer_text_bn: cfg.footer_text_bn || '',
                            footer_text_en: cfg.footer_text_en || '',
                            primary_color: cfg.primary_color || '#2563EB',
                            bg_shade: cfg.bg_shade || '#F8FAFC',
                            custom_themes: Array.isArray(cfg.custom_themes) ? [...cfg.custom_themes] : [],
                            custom_designations: Array.isArray(cfg.custom_designations) ? [...cfg.custom_designations] : [],
                            announcement_enabled: !!cfg.announcement_enabled,
                            announcement_id: cfg.announcement_id || 'announcement-1',
                            announcement_title_bn: cfg.announcement_title_bn || '',
                            announcement_title_en: cfg.announcement_title_en || '',
                            announcement_msg_bn: cfg.announcement_msg_bn || '',
                            announcement_msg_en: cfg.announcement_msg_en || '',
                            announcement_start: cfg.announcement_start ? cfg.announcement_start.slice(0, 16) : '',
                            announcement_end: cfg.announcement_end ? cfg.announcement_end.slice(0, 16) : ''
                        };
                    } catch (err) {
                        console.error('Config load failed:', err);
                    }
                },

                addThemePreset() {
                    const hex = this.newThemeColor.trim().toUpperCase();
                    if (!hex || this.configForm.custom_themes.includes(hex)) return;
                    this.configForm.custom_themes.push(hex);
                },

                removeThemePreset(index) {
                    this.configForm.custom_themes.splice(index, 1);
                },

                addDesignation() {
                    const val = this.newDesignationText.trim();
                    if (!val || this.configForm.custom_designations.includes(val)) return;
                    this.configForm.custom_designations.push(val);
                    this.newDesignationText = '';
                },

                removeDesignation(index) {
                    this.configForm.custom_designations.splice(index, 1);
                },

                async saveSiteConfig() {
                    this.savingConfig = true;
                    try {
                        const payload = {
                            ...this.configForm,
                            announcement_start: this.configForm.announcement_start ? new Date(this.configForm.announcement_start).toISOString() : null,
                            announcement_end: this.configForm.announcement_end ? new Date(this.configForm.announcement_end).toISOString() : null
                        };
                        await TourMateAPI.updateAdminConfig(payload);
                        window.showToast(this.lang === 'bn' ? '🎉 সাইটের সকল কনফিগারেশন সফলভাবে লাইভ সংরক্ষিত হয়েছে!' : 'Site configuration saved live!', 'success');
                    } catch (err) {
                        window.showToast(err.message || 'Config save failed', 'error');
                    } finally {
                        this.savingConfig = false;
                    }
                },

                async loadFeedbacks() {
                    this.loadingFeedbacks = true;
                    try {
                        const params = {};
                        if (this.feedbackTypeFilter !== 'ALL') params.feedback_type = this.feedbackTypeFilter;
                        if (this.feedbackStatusFilter !== 'ALL') params.status = this.feedbackStatusFilter;
                        this.feedbacksList = await TourMateAPI.getAdminFeedbacks(params);
                    } catch (err) {
                        console.error('Feedbacks load failed:', err);
                    } finally {
                        this.loadingFeedbacks = false;
                    }
                },

                openReplyBox(item) {
                    this.activeReplyId = item.id;
                    this.replyText = item.admin_reply || '';
                    this.replyMarkResolved = true;
                },

                async submitReply(feedbackId) {
                    if (!this.replyText.trim()) return;
                    this.replySubmitting = true;
                    try {
                        const payload = {
                            reply: this.replyText.trim(),
                            status: this.replyMarkResolved ? 'RESOLVED' : 'PENDING'
                        };
                        const updated = await TourMateAPI.replyAdminFeedback(feedbackId, payload);
                        const idx = this.feedbacksList.findIndex(f => f.id === feedbackId);
                        if (idx !== -1) {
                            this.feedbacksList[idx] = updated;
                        }
                        this.activeReplyId = null;
                        this.replyText = '';
                        window.showToast(this.lang === 'bn' ? 'ইউজারের মেসেজে সফলভাবে উত্তর পাঠানো হয়েছে!' : 'Reply sent successfully!', 'success');
                        this.loadMetrics();
                    } catch (err) {
                        window.showToast(err.message || 'Failed to send reply', 'error');
                    } finally {
                        this.replySubmitting = false;
                    }
                },

                openEditFeedbackModal(item) {
                    this.feedbackEditForm = {
                        id: item.id,
                        message: item.message || '',
                        feedback_type: item.feedback_type || 'SUGGESTION',
                        status: item.status || 'PENDING',
                        admin_reply: item.admin_reply || ''
                    };
                    this.showFeedbackEditModal = true;
                },

                async saveFeedbackEdit() {
                    if (!this.feedbackEditForm.id || !this.feedbackEditForm.message.trim()) return;
                    this.savingFeedbackEdit = true;
                    try {
                        const payload = {
                            message: this.feedbackEditForm.message.trim(),
                            feedback_type: this.feedbackEditForm.feedback_type,
                            status: this.feedbackEditForm.status,
                            admin_reply: this.feedbackEditForm.admin_reply ? this.feedbackEditForm.admin_reply.trim() : ''
                        };
                        const updated = await TourMateAPI.updateAdminFeedback(this.feedbackEditForm.id, payload);
                        const idx = this.feedbacksList.findIndex(f => f.id === this.feedbackEditForm.id);
                        if (idx !== -1) {
                            this.feedbacksList[idx] = updated;
                        }
                        this.showFeedbackEditModal = false;
                        window.showToast(this.lang === 'bn' ? 'ফিডব্যাক তথ্য সফলভাবে আপডেট হয়েছে!' : 'Feedback updated successfully!', 'success');
                        this.loadMetrics();
                    } catch (err) {
                        window.showToast(err.message || 'Failed to update feedback', 'error');
                    } finally {
                        this.savingFeedbackEdit = false;
                    }
                },

                async deleteFeedback(item) {
                    const confirmMsg = this.lang === 'bn'
                        ? `আপনি কি নিশ্চিত যে এই ${item.feedback_type === 'COMPLAINT' ? 'অভিযোগটি' : 'পরামর্শটি'} চিরতরে মুছে ফেলতে চান?`
                        : `Are you sure you want to permanently delete this ${item.feedback_type.toLowerCase()}?`;
                    if (!confirm(confirmMsg)) return;

                    try {
                        await TourMateAPI.deleteAdminFeedback(item.id);
                        this.feedbacksList = this.feedbacksList.filter(f => f.id !== item.id);
                        window.showToast(this.lang === 'bn' ? 'ফিডব্যাক সফলভাবে মুছে ফেলা হয়েছে।' : 'Feedback deleted successfully.', 'success');
                        this.loadMetrics();
                    } catch (err) {
                        window.showToast(err.message || 'Failed to delete feedback', 'error');
                    }
                }
            };
        }
    </script>
</body>
</html>
