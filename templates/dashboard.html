{% extends "base.html" %}

{% block title %}আমার ট্যুরসমূহ - TourMate{% endblock %}

{% block content %}
<div x-data="dashboardPage()" class="flex-1 flex flex-col pb-24">

    <!-- Top App Navigation Bar with Language Toggle -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200/80 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white font-bold text-sm shadow-md shadow-blue-500/20">
                <span x-text="userInitials">TM</span>
            </div>
            <div>
                <h1 class="text-xs font-medium text-slate-400" x-text="lang === 'bn' ? 'স্বাগতম,' : 'Welcome,'"></h1>
                <p class="text-sm font-bold text-slate-900 leading-tight" x-text="userName"></p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- Add Tour Button -->
            <button @click="openCreateModal()"
                    class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold flex items-center gap-1 shadow-md shadow-blue-500/20 active:scale-95 transition-all">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
                </svg>
                <span x-text="lang === 'bn' ? 'নতুন ট্যুর' : 'New Tour'"></span>
            </button>

            <!-- Settings Button (Opens Modal with Language, Theme, Profile & Admin) -->
            <button id="header-settings-btn"
                    @click="openSettingsModal()"
                    :title="lang === 'bn' ? 'সেটিংস ও প্রোফাইল' : 'Settings & Profile'"
                    class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700 flex items-center justify-center active:scale-95 transition-all">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="px-4 py-4 flex-1 flex flex-col">

        <!-- Demo Account Mode Banner -->
        <template x-if="isDemoUser">
            <div class="mb-4 bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-700 text-white rounded-3xl p-4 shadow-lg shadow-blue-500/20 border border-blue-400/30 flex flex-col sm:flex-row sm:items-center justify-between gap-3 animate-fadeIn">
                <div class="flex items-start gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-white/20 flex items-center justify-center text-xl flex-shrink-0">
                        💡
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-white flex items-center gap-1.5">
                            <span x-text="lang === 'bn' ? 'ডেমো অ্যাকাউন্ট মোড' : 'Demo Account Mode'"></span>
                            <span class="px-2 py-0.5 rounded-full text-[9px] font-bold bg-amber-400 text-slate-900">🔒 নমুনা ডেমো ডেটা</span>
                        </h3>
                        <p class="text-xs text-blue-100 mt-0.5 leading-relaxed" x-text="lang === 'bn' ? 'ট্যুরমেটের কমন ফান্ড ব্যালেন্স, মেম্বারদের একক খরচের ভাগ, দেনা-পাওনা ও পূর্ণাঙ্গ গাইডলাইন দেখতে ডেমো ট্যুরে প্রবেশ করুন।' : 'Explore demo tour to understand common fund calculation, individual cost split, settlement and guidelines.'"></p>
                    </div>
                </div>
                <div class="flex items-center gap-2 flex-shrink-0">
                    <button @click="goToDemoTour()"
                            class="px-3.5 py-2 bg-white text-blue-700 rounded-xl font-bold text-xs hover:bg-blue-50 active:scale-95 transition-all shadow-xs flex items-center gap-1">
                        <span>👀</span>
                        <span x-text="lang === 'bn' ? 'ডেমো ট্যুর দেখুন' : 'View Demo Tour'"></span>
                    </button>
                    <button @click="logout()"
                            class="px-3 py-2 bg-white/20 hover:bg-rose-600 text-white rounded-xl font-bold text-xs active:scale-95 transition-all">
                        <span x-text="lang === 'bn' ? 'লগআউট' : 'Logout'"></span>
                    </button>
                </div>
            </div>
        </template>

        <!-- Top Header: Simple Total Tours Count -->
        <div class="flex items-center justify-between mb-4 px-1 pt-1">
            <div>
                <h2 class="text-lg font-bold text-slate-900" x-text="lang === 'bn' ? 'আপনার ট্যুরসমূহ' : 'Your Tours'"></h2>
                <p class="text-xs text-slate-400" x-text="lang === 'bn' ? 'চলমান ও সম্পন্ন হওয়া সব ট্রিপ' : 'Active & completed trips'"></p>
            </div>
            <div class="flex items-center gap-2">
                <span class="px-3 py-1 bg-blue-50 text-blue-700 border border-blue-200/60 rounded-full text-xs font-bold"
                      x-text="lang === 'bn' ? `মোট ${tours.length} টি ট্যুর` : `Total ${tours.length} Tour(s)`"></span>
            </div>
        </div>

        <!-- Loading Skeleton -->
        <template x-if="loading">
            <div class="space-y-3">
                <div class="h-28 bg-slate-200/70 rounded-3xl animate-pulse"></div>
                <div class="h-28 bg-slate-200/70 rounded-3xl animate-pulse"></div>
            </div>
        </template>

        <!-- Empty State -->
        <template x-if="!loading && tours.length === 0">
            <div class="flex-1 flex flex-col items-center justify-center text-center py-16 px-4">
                <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-3xl flex items-center justify-center mb-3">
                    <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <h3 class="text-sm font-bold text-slate-800" x-text="lang === 'bn' ? 'কোনো ট্যুর নেই' : 'No tours yet'"></h3>
                <p class="text-xs text-slate-400 mt-1 max-w-xs" x-text="lang === 'bn' ? 'নতুন ট্যুর তৈরি করে বন্ধুদের সাথে খরচ ট্র্যাকিং শুরু করুন।' : 'Create a tour to start tracking group expenses.'"></p>
                <button @click="openCreateModal()" class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-2xl text-xs font-semibold shadow-md active:scale-95 transition-all">
                    + <span x-text="lang === 'bn' ? 'প্রথম ট্যুর যোগ করুন' : 'Create First Tour'"></span>
                </button>
            </div>
        </template>

        <!-- Tour Cards List -->
        <template x-if="!loading && tours.length > 0">
            <div class="space-y-3.5">
                <template x-for="tour in tours" :key="tour.id">
                    <div @click="goToTour(tour.id)"
                         class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-sm hover:shadow-md hover:border-blue-300 active:scale-[0.99] transition-all relative flex flex-col justify-between cursor-pointer group">
                        
                        <!-- Left Theme Color Stripe -->
                        <div class="absolute left-0 top-0 bottom-0 w-2.5 rounded-l-3xl" :style="`background-color: ${tour.color_theme || '#2563EB'}`"></div>

                        <!-- Top Title & Quick Actions -->
                        <div class="flex items-start justify-between gap-3 pl-1.5">
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2">
                                    <h3 class="text-sm font-bold text-slate-900 leading-snug hover:text-blue-600" x-text="tour.title"></h3>
                                    <template x-if="tour.is_archived">
                                        <span class="px-2 py-0.5 rounded-full text-[9px] font-bold bg-amber-100 text-amber-800 border border-amber-200"
                                              x-text="lang === 'bn' ? '🔒 আর্কাইভড' : '🔒 Archived'"></span>
                                    </template>
                                </div>
                                <p class="text-[11px] text-slate-400 mt-0.5" x-text="formatDate(tour.created_at)"></p>
                                <!-- Truncated Tour Description Preview -->
                                <template x-if="tour.description">
                                    <p class="text-xs text-slate-500 mt-2 line-clamp-2 leading-relaxed"
                                       x-text="tour.description.length > 85 ? tour.description.slice(0, 85) + '...' : tour.description"></p>
                                </template>
                            </div>
                            <div class="flex items-center gap-1.5">
                                <template x-if="tour.is_archived">
                                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800 border border-amber-200/80">
                                        🔒 <span x-text="lang === 'bn' ? 'আর্কাইভড' : 'Archived'"></span>
                                    </span>
                                </template>
                                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-slate-100 text-slate-600">
                                    <span x-text="lang === 'bn' ? `${tour.members_count} জন` : `${tour.members_count} members`"></span>
                                </span>
                                <!-- 3-Dot Action Menu -->
                                <div class="relative" x-data="{ openMenu: false }">
                                    <button @click.stop="openMenu = !openMenu"
                                            class="w-7 h-7 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 flex items-center justify-center transition-colors active:scale-95"
                                            :title="lang === 'bn' ? 'মেনু' : 'Menu'">
                                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                                            <circle cx="12" cy="5" r="2" />
                                            <circle cx="12" cy="12" r="2" />
                                            <circle cx="12" cy="19" r="2" />
                                        </svg>
                                    </button>

                                    <!-- Dropdown Menu (No sliding, high z-index, clean visibility) -->
                                    <div x-show="openMenu"
                                         @click.away="openMenu = false"
                                         class="absolute right-0 top-full mt-1.5 w-48 bg-white rounded-2xl shadow-2xl border border-slate-200 py-1.5 z-50 text-left"
                                         x-cloak>
                                        <!-- Edit Tour Details -->
                                        <button @click.stop="openMenu = false; openEditTour(tour)"
                                                class="w-full px-3.5 py-2.5 text-left text-xs font-semibold text-slate-700 hover:bg-slate-50 flex items-center gap-2.5 transition-colors">
                                            <svg class="w-4 h-4 text-blue-600 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                                            </svg>
                                            <span x-text="lang === 'bn' ? 'ট্যুর এডিট করুন' : 'Edit Tour Details'"></span>
                                        </button>
                                        <!-- Archive / Unarchive Tour -->
                                        <button @click.stop="openMenu = false; toggleArchiveTour(tour)"
                                                class="w-full px-3.5 py-2.5 text-left text-xs font-semibold text-amber-700 hover:bg-amber-50 flex items-center gap-2.5 transition-colors">
                                            <svg class="w-4 h-4 text-amber-600 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
                                            </svg>
                                            <span x-text="tour.is_archived ? (lang === 'bn' ? 'আন-আর্কাইভ করুন' : 'Unarchive Tour') : (lang === 'bn' ? 'ট্যুর আর্কাইভ করুন' : 'Archive Tour')"></span>
                                        </button>
                                        <div class="my-1 border-t border-slate-100"></div>
                                        <!-- Delete Tour -->
                                        <button @click.stop="openMenu = false; confirmDeleteTour(tour)"
                                                class="w-full px-3.5 py-2.5 text-left text-xs font-semibold text-rose-600 hover:bg-rose-50 flex items-center gap-2.5 transition-colors">
                                            <svg class="w-4 h-4 text-rose-500 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                            </svg>
                                            <span x-text="lang === 'bn' ? 'ট্যুর মুছে ফেলুন' : 'Delete Tour'"></span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Financial Summary Badges -->
                        <div class="grid grid-cols-3 gap-2 mt-3 pt-2.5 border-t border-slate-100 pl-1.5 text-center">
                            <div class="bg-slate-50 p-1.5 rounded-2xl">
                                <span class="text-[9px] font-semibold uppercase text-slate-400 block" x-text="lang === 'bn' ? 'মোট জমা' : 'Credit'"></span>
                                <span class="text-xs font-bold text-emerald-600 block mt-0.5" x-text="`৳ ${formatMoney(tour.total_credit)}`"></span>
                            </div>
                            <div class="bg-slate-50 p-1.5 rounded-2xl">
                                <span class="text-[9px] font-semibold uppercase text-slate-400 block" x-text="lang === 'bn' ? 'মোট খরচ' : 'Debit'"></span>
                                <span class="text-xs font-bold text-rose-500 block mt-0.5" x-text="`৳ ${formatMoney(tour.total_debit)}`"></span>
                            </div>
                            <div class="bg-blue-50/80 p-1.5 rounded-2xl border border-blue-100/60">
                                <span class="text-[9px] font-semibold uppercase text-blue-500 block" x-text="lang === 'bn' ? 'অবশিষ্ট' : 'Remaining'"></span>
                                <span class="text-xs font-bold text-blue-700 block mt-0.5" x-text="`৳ ${formatMoney(tour.remaining_balance)}`"></span>
                            </div>
                        </div>

                    </div>
                </template>
            </div>
        </template>

    </div>

    <!-- Create Tour Bottom Sheet Modal -->
    <div x-show="showCreateModal"
         class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-end justify-center"
         x-cloak>
        <div class="absolute inset-0" @click="showCreateModal = false"></div>
        <div class="relative z-10 w-full max-w-md bg-white rounded-t-4xl p-6 shadow-2xl border-t border-slate-200 max-h-[90vh] overflow-y-auto no-scrollbar pb-safe">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-4"></div>

            <div class="flex items-center justify-between mb-4">
                <div>
                    <h3 class="text-base font-bold text-slate-900" x-text="lang === 'bn' ? 'নতুন ট্যুর যোগ করুন' : 'Create New Tour'"></h3>
                    <p class="text-xs text-slate-400" x-text="lang === 'bn' ? 'ট্যুরের নাম ও প্রাথমিক বাজেট নির্ধারণ করুন' : 'Set title, theme color and optional budget'"></p>
                </div>
                <button @click="showCreateModal = false" class="p-1 rounded-full text-slate-400 hover:bg-slate-100">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <form @submit.prevent="submitCreateTour()" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5" x-text="lang === 'bn' ? 'ট্যুরের নাম *' : 'Tour Title *'"></label>
                    <input type="text"
                           x-model="newTour.title"
                           required
                           :placeholder="lang === 'bn' ? 'যেমন: বান্দরবান ট্র্যাকিং ২০২৬' : 'e.g. Mountain Expedition 2026'"
                           class="w-full min-h-[48px] px-4 rounded-2xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 font-medium">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5" x-text="lang === 'bn' ? 'বিবরণ / নোট (ঐচ্ছিক)' : 'Description (Optional)'"></label>
                    <textarea x-model="newTour.description"
                              rows="2"
                              :placeholder="lang === 'bn' ? 'ট্যুরের পরিকল্পনা বা স্থান...' : 'Notes or itinerary...'"
                              class="w-full px-4 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 font-medium"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5" x-text="lang === 'bn' ? 'বাজেট লিমিট (৳) (ঐচ্ছিক)' : 'Budget Limit (৳) (Optional)'"></label>
                    <input type="number"
                           step="0.01"
                           x-model="newTour.budget_limit"
                           :placeholder="lang === 'bn' ? '০.০০' : '0.00'"
                           class="w-full min-h-[48px] px-4 rounded-2xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 font-medium">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-2" x-text="lang === 'bn' ? 'কালার থিম নির্বাচন করুন' : 'Select Color Theme'"></label>
                    <div class="flex items-center gap-3">
                        <template x-for="color in themePresets" :key="color">
                            <button type="button"
                                    @click="newTour.color_theme = color"
                                    :style="`background-color: ${color}`"
                                    :class="newTour.color_theme === color ? 'ring-4 ring-offset-2 ring-blue-500 scale-110' : 'opacity-80 hover:opacity-100'"
                                    class="w-9 h-9 rounded-full transition-all active:scale-95 shadow-sm"></button>
                        </template>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit"
                            :disabled="saving"
                            class="w-full min-h-[50px] bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl shadow-lg shadow-blue-500/25 flex items-center justify-center gap-2 active:scale-95 transition-all text-sm disabled:opacity-60">
                        <span x-text="saving ? (lang === 'bn' ? 'তৈরি হচ্ছে...' : 'Creating...') : (lang === 'bn' ? 'ট্যুর তৈরি করুন' : 'Create Tour')"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Tour Details Bottom Sheet Modal -->
    <div x-show="showEditTourModal"
         class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-end justify-center"
         x-cloak>
        <div class="absolute inset-0" @click="showEditTourModal = false"></div>
        <div class="relative z-10 w-full max-w-md bg-white rounded-t-4xl p-6 shadow-2xl border-t border-slate-200 max-h-[90vh] overflow-y-auto no-scrollbar pb-safe">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-4"></div>

            <div class="flex items-center justify-between mb-4">
                <div>
                    <h3 class="text-base font-bold text-slate-900" x-text="lang === 'bn' ? 'ট্যুর তথ্য এডিট করুন' : 'Edit Tour Details'"></h3>
                    <p class="text-xs text-slate-400" x-text="lang === 'bn' ? 'নাম, বিবরণ, বাজেট ও থিম পরিবর্তন করুন' : 'Update title, description, budget & theme'"></p>
                </div>
                <button @click="showEditTourModal = false" class="p-1 rounded-full text-slate-400 hover:bg-slate-100">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <form @submit.prevent="submitEditTour()" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5" x-text="lang === 'bn' ? 'ট্যুরের নাম *' : 'Tour Title *'"></label>
                    <input type="text"
                           x-model="editTourForm.title"
                           required
                           class="w-full min-h-[48px] px-4 rounded-2xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 font-medium">
                </div>

                <div>

                        <button type="submit"
                                :disabled="feedbackSaving || !feedbackForm.message.trim()"
                                class="w-full py-2.5 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white rounded-xl text-xs font-bold shadow-md shadow-blue-500/20 active:scale-95 transition-all flex items-center justify-center gap-2 disabled:opacity-50">
                            <template x-if="feedbackSaving">
                                <svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
                            </template>
                            <span x-text="feedbackSaving ? (lang === 'bn' ? 'পাঠানো হচ্ছে...' : 'Sending...') : (lang === 'bn' ? 'মতামত সাবমিট করুন' : 'Submit Feedback')"></span>
                        </button>
                    </form>

                    <!-- Feed of recent feedback -->
                    <div class="pt-3 border-t border-slate-100 dark:border-slate-800 space-y-2.5">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-slate-700 dark:text-slate-300" x-text="lang === 'bn' ? 'সাম্প্রতিক মতামতসমূহ' : 'Recent Feedback'"></span>
                            <button type="button" @click="loadFeedbacks()" class="text-[10px] text-blue-600 dark:text-blue-400 font-bold hover:underline">
                                ↻ <span x-text="lang === 'bn' ? 'রিফ্রেশ' : 'Refresh'"></span>
                            </button>
                        </div>

                        <template x-if="loadingFeedbacks">
                            <div class="py-4 text-center text-xs text-slate-400 animate-pulse" x-text="lang === 'bn' ? 'লোড হচ্ছে...' : 'Loading...'"></div>
                        </template>

                        <template x-if="!loadingFeedbacks && feedbacks.length === 0">
                            <div class="py-4 text-center text-xs text-slate-400" x-text="lang === 'bn' ? 'এখনো কোনো মতামত জমা হয়নি।' : 'No feedback submitted yet.'"></div>
                        </template>

                        <template x-if="!loadingFeedbacks && feedbacks.length > 0">
                            <div class="space-y-2 max-h-48 overflow-y-auto pr-1">
                                <template x-for="item in feedbacks" :key="item.id">
                                    <div class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200/70 dark:border-slate-700 text-xs space-y-1">
                                        <div class="flex items-center justify-between gap-1">
                                            <span class="px-1.5 py-0.5 rounded-md text-[10px] font-bold"
                                                  :class="item.feedback_type === 'COMPLAINT' ? 'bg-rose-100 text-rose-700 border border-rose-200' : 'bg-blue-100 text-blue-700 border border-blue-200'"
                                                  x-text="item.feedback_type === 'COMPLAINT' ? (lang === 'bn' ? '⚠️ অভিযোগ' : '⚠️ Complaint') : (lang === 'bn' ? '💡 পরামর্শ' : '💡 Suggestion')"></span>
                                            <span class="text-[10px] text-slate-400" x-text="new Date(item.created_at).toLocaleDateString(lang === 'bn' ? 'bn-BD' : 'en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })"></span>
                                        </div>
                                        <p class="text-xs text-slate-800 dark:text-slate-200 leading-relaxed font-medium" x-text="item.message"></p>
                                        <div class="text-[10px] text-slate-500 dark:text-slate-400 pt-1 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between">
                                            <span class="font-bold text-slate-700 dark:text-slate-300" x-text="`${lang === 'bn' ? 'প্রেরক:' : 'From:'} ${item.user_name}`"></span>
                                            <span class="font-mono text-slate-400 truncate max-w-[140px]" x-text="item.user_email"></span>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>

                </div>

            </div>

        </div>
    </div>

    <!-- Demo Action Locked Modal -->
    <div x-show="showDemoLockModal"
         @click.self="showDemoLockModal = false"
         class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4"
         x-cloak>
        <div class="bg-white dark:bg-slate-900 rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl border border-slate-100 dark:border-slate-800 animate-scaleUp">
            <div class="w-14 h-14 bg-amber-50 dark:bg-amber-950/40 text-amber-600 dark:text-amber-400 rounded-3xl flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
                🔒
            </div>
            <h3 class="text-base font-bold text-slate-900 dark:text-white mb-1" x-text="lang === 'bn' ? 'ডেমো অ্যাকাউন্ট লক করা রয়েছে' : 'Demo Account is Locked'"></h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 mb-5 leading-relaxed" x-text="lang === 'bn' ? 'ডেমো অ্যাকাউন্টে নতুন ট্যুর তৈরি বা মুছে ফেলা লক রাখা হয়েছে। আপনার বন্ধুদের নিয়ে বাস্তব ট্যুর খুলতে ও পরিচালনা করতে অনুগ্রহ করে লগআউট করে Google দিয়ে লগইন করুন।' : 'Creating or deleting tours is locked in demo mode. Please log out and sign in with Google to manage your own real tours!'"></p>
            
            <div class="flex flex-col gap-2">
                <button @click="logout()"
                        class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl text-xs active:scale-95 transition-all shadow-md">
                    <span x-text="lang === 'bn' ? 'লগআউট করে Google দিয়ে ঢুকুন' : 'Log Out & Sign In with Google'"></span>
                </button>
                <button @click="showDemoLockModal = false; goToDemoTour()"
                        class="w-full py-2 bg-indigo-50 dark:bg-indigo-950/40 text-indigo-700 dark:text-indigo-300 font-semibold rounded-2xl text-xs hover:bg-indigo-100">
                    <span x-text="lang === 'bn' ? '👀 ডেমো ট্যুরে ফিরে যান' : '👀 Return to Demo Tour'"></span>
                </button>
                <button @click="showDemoLockModal = false"
                        class="w-full py-2 text-slate-400 font-medium text-xs hover:text-slate-600">
                    <span x-text="lang === 'bn' ? 'বন্ধ করুন' : 'Close'"></span>
                </button>
            </div>
        </div>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
function dashboardPage() {
    return {
        loading: true,
        saving: false,
        lang: (function() {
            try { return localStorage.getItem('tourmate_lang') || 'en'; } catch(e) { return 'en'; }
        })(),
        tours: [],
        userName: 'User',
        userInitials: 'TM',
        showCreateModal: false,
        showSettingsModal: false,
        theme: (function() {
            try { return localStorage.getItem('tourmate_theme') || 'light'; } catch(e) { return 'light'; }
        })(),
        settingsView: 'main',
        showEditTourModal: false,
        showDemoLockModal: false,

        get isDemoUser() {
            const user = TourMateAPI.getUser();
            return user && user.email === 'alex@tourmate.test';
        },

        goToDemoTour() {
            if (this.tours && this.tours.length > 0) {
                this.goToTour(this.tours[0].id);
            } else {
                window.location.href = '/tours/6c718b10-c0e7-4ca7-9c71-66b320f94a8d';
            }
        },

        editTourForm: {
            id: '',
            title: '',
            description: '',
            budget_limit: '',
            color_theme: '#2563EB',
            saving: false
        },
        profileForm: {
            first_name: '',
            last_name: '',
            email: '',
            is_staff: false
        },
        profileSaving: false,
        feedbackForm: {
            feedback_type: 'SUGGESTION',
            message: ''
        },
        feedbackSaving: false,
        feedbacks: [],
        loadingFeedbacks: false,
        themePresets: ['#2563EB', '#059669', '#E11D48', '#D97706', '#7C3AED'],

        newTour: {
            title: '',
            description: '',
            budget_limit: '',
            color_theme: '#2563EB'
        },

        init() {
            if (!TourMateAPI.ensureAuth()) return;

            const user = TourMateAPI.getUser();
            if (user) {
                this.userName = user.first_name ? `${user.first_name} ${user.last_name || ''}`.trim() : user.email;
                this.userInitials = (user.first_name ? user.first_name[0] : user.email[0]).toUpperCase();
            }

            // SWR Instant Paint: Render cached tours in 0ms
            try {
                const cached = localStorage.getItem('tm_cache_tours');
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        this.tours = parsed;
                        this.loading = false;
                    }
                }
            } catch (e) {}

            this.loadTours();

            window.addEventListener('tourmate-synced-refresh', () => {
                this.loadTours();
            });

            // Silent Smart Sync: Updates tour cards on focus or gentle 15s interval
            const silentToursSync = () => {
                if (!document.hidden && navigator.onLine) {
                    this.loadTours();
                }
            };
            setInterval(silentToursSync, 15000);
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) silentToursSync();
            });
            window.addEventListener('focus', () => {
                silentToursSync();
            });
        },

        openSettingsModal(tab = 'main') {
            this.settingsView = tab;
            const user = TourMateAPI.getUser() || {};
            this.profileForm.first_name = user.first_name || '';
            this.profileForm.last_name = user.last_name || '';
            this.profileForm.email = user.email || '';
            this.profileForm.is_staff = !!(user.is_staff || user.is_superuser);
            this.theme = localStorage.getItem('tourmate_theme') || 'light';
            this.showSettingsModal = true;
            if (tab === 'feedback') {
                this.loadFeedbacks();
            }
        },

        openEditTour(tour) {
            this.editTourForm = {
                id: tour.id,
                title: tour.title || '',
                description: tour.description || '',
                budget_limit: tour.budget_limit || '',
                color_theme: tour.color_theme || '#2563EB',
                saving: false
            };
            this.showEditTourModal = true;
        },

        async submitEditTour() {
            if (this.isDemoUser) {
                this.showDemoLockModal = true;
                return;
            }
            if (!this.editTourForm.title || !this.editTourForm.id) return;
            this.editTourForm.saving = true;
            try {
                const payload = {
                    title: this.editTourForm.title.trim(),
                    description: this.editTourForm.description ? this.editTourForm.description.trim() : '',
                    color_theme: this.editTourForm.color_theme
                };
                if (this.editTourForm.budget_limit !== '' && this.editTourForm.budget_limit !== null) {
                    payload.budget_limit = parseFloat(this.editTourForm.budget_limit);
                } else {
                    payload.clear_budget = true;
                }

                const updated = await TourMateAPI.updateTour(this.editTourForm.id, payload);
                const idx = this.tours.findIndex(t => t.id === this.editTourForm.id);
                if (idx !== -1) {
                    this.tours[idx].title = updated.title;
                    this.tours[idx].description = updated.description;
                    this.tours[idx].color_theme = updated.color_theme;
                    this.tours[idx].budget_limit = updated.budget_limit;
                }
                window.showToast(this.lang === 'bn' ? 'ট্যুর সফলভাবে আপডেট হয়েছে!' : 'Tour updated successfully!', 'success');
                this.showEditTourModal = false;
            } catch (err) {
                window.showToast(err.message || 'আপডেট করতে সমস্যা হয়েছে', 'error');
            } finally {
                this.editTourForm.saving = false;
            }
        },

        setTheme(val) {
            this.theme = val;
            localStorage.setItem('tourmate_theme', val);
            if (val === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        },

        setLang(val) {
            this.lang = val;
            localStorage.setItem('tourmate_lang', val);
        },

        toggleLang() {
            this.setLang(this.lang === 'bn' ? 'en' : 'bn');
        },

        async saveProfile() {
            if (!this.profileForm.first_name.trim()) return;
            this.profileSaving = true;
            try {
                const updated = await TourMateAPI.updateProfile({
                    first_name: this.profileForm.first_name.trim(),
                    last_name: this.profileForm.last_name.trim()
                });
                this.userName = updated.first_name ? `${updated.first_name} ${updated.last_name || ''}`.trim() : updated.email;
                this.userInitials = (updated.first_name ? updated.first_name[0] : updated.email[0]).toUpperCase();
                window.showToast(this.lang === 'bn' ? 'প্রোফাইল সফলভাবে আপডেট করা হয়েছে!' : 'Profile updated successfully!', 'success');
                this.showSettingsModal = false;
            } catch (err) {
                window.showToast(err.message || 'Error updating profile', 'error');
            } finally {
                this.profileSaving = false;
            }
        },

        async loadFeedbacks() {
            this.loadingFeedbacks = true;
            try {
                const data = await TourMateAPI.getFeedbacks();
                this.feedbacks = data || [];
            } catch (err) {
                console.warn('Could not load feedbacks:', err);
            } finally {
                this.loadingFeedbacks = false;
            }
        },

        async submitFeedback() {
            if (!this.feedbackForm.message.trim()) return;
            this.feedbackSaving = true;
            try {
                const res = await TourMateAPI.submitFeedback({
                    feedback_type: this.feedbackForm.feedback_type,
                    message: this.feedbackForm.message.trim()
                });
                if (res && res.id) {
                    this.feedbacks.unshift(res);
                } else {
                    this.loadFeedbacks();
                }
                this.feedbackForm.message = '';
                window.showToast(this.lang === 'bn' ? 'আপনার মতামত পাঠানো হয়েছে! ধন্যবাদ।' : 'Thank you! Your feedback has been sent.', 'success');
            } catch (err) {
                window.showToast(err.message || 'Error submitting feedback', 'error');
            } finally {
                this.feedbackSaving = false;
            }
        },

        async loadTours() {
            if (this.tours.length === 0) {
                this.loading = true;
            }
            try {
                const data = await TourMateAPI.getTours();
                this.tours = data;
                try {
                    localStorage.setItem('tm_cache_tours', JSON.stringify(data));
                } catch (e) {}
            } catch (err) {
            } finally {
                this.loading = false;
            }
        },

        openCreateModal() {
            if (this.isDemoUser) {
                this.showDemoLockModal = true;
                return;
            }
            this.newTour = {
                title: '',
                description: '',
                budget_limit: '',
                color_theme: '#2563EB'
            };
            this.showCreateModal = true;
        },

        async submitCreateTour() {
            if (!this.newTour.title.trim()) return;
            this.saving = true;

            const payload = {
                title: this.newTour.title.trim(),
                description: this.newTour.description.trim(),
                color_theme: this.newTour.color_theme,
                budget_limit: this.newTour.budget_limit ? parseFloat(this.newTour.budget_limit) : null
            };

            try {
                const created = await TourMateAPI.createTour(payload);
                window.showToast(this.lang === 'bn' ? 'নতুন ট্যুর তৈরি হয়েছে!' : 'New tour created!', 'success');
                this.showCreateModal = false;
                setTimeout(() => {
                    window.location.href = `/tours/${created.id}`;
                }, 300);
            } catch (err) {
                this.saving = false;
            }
        },

        async toggleArchiveTour(tour) {
            if (this.isDemoUser) {
                this.showDemoLockModal = true;
                return;
            }
            try {
                const res = await TourMateAPI.toggleArchiveTour(tour.id);
                tour.is_archived = res.is_archived;
                window.showToast(this.lang === 'bn' 
                    ? (tour.is_archived ? '🔒 ট্যুর সফলভাবে আর্কাইভ ও লক করা হয়েছে' : 'ট্যুর আনআর্কাইভ করা হয়েছে') 
                    : (tour.is_archived ? '🔒 Tour archived and locked' : 'Tour unarchived successfully'), 'success');
            } catch(err) {
                window.showToast(err.message || 'Error updating tour', 'error');
            }
        },

        async confirmDeleteTour(tour) {
            if (this.isDemoUser) {
                this.showDemoLockModal = true;
                return;
            }
            const msg = this.lang === 'bn' 
                ? `আপনি কি নিশ্চিত যে '${tour.title}' ট্যুরটি সম্পূর্ণ মুছে ফেলতে চান?` 
                : `Are you sure you want to permanently delete '${tour.title}'?`;
            if (confirm(msg)) {
                try {
                    await TourMateAPI.deleteTour(tour.id);
                    window.showToast(this.lang === 'bn' ? 'ট্যুর মুছে ফেলা হয়েছে' : 'Tour deleted', 'info');
                    await this.loadTours();
                } catch (e) {}
            }
        },

        goToTour(id) {
            const clicked = this.tours.find(t => t.id === id);
            if (clicked) {
                try {
                    const raw = localStorage.getItem(`tm_cache_dash_${id}`);
                    let cached = {};
                    if (raw) {
                        try { cached = JSON.parse(raw); } catch (e) {}
                    }
                    cached.tour = clicked;
                    if (clicked.summary) cached.summary = clicked.summary;
                    localStorage.setItem(`tm_cache_dash_${id}`, JSON.stringify(cached));
                } catch (e) {}
            }
            window.location.href = `/tours/${id}`;
        },

        logout() {
            if (confirm(this.lang === 'bn' ? 'আপনি কি নিশ্চিত যে লগআউট করতে চান?' : 'Are you sure you want to log out?')) {
                TourMateAPI.logout();
            }
        },

        formatMoney(val) {
            const num = parseFloat(val || 0);
            return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        },

        formatDate(isoStr) {
            if (!isoStr) return '';
            const d = new Date(isoStr);
            return d.toLocaleDateString(this.lang === 'bn' ? 'bn-BD' : 'en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }
    };
}
</script>
{% endblock %}
